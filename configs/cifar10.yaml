# CIFAR-10 metric matching (plain low-rank loss, no mean-centring).
# Hyperparameters match the training run that produced the released CIFAR-10
# metric model (see its .hydra/config.yaml).
defaults:
  - _self_

hydra:
  run:
    dir: outputs/metric/${data.name}/${now:%Y-%m-%d_%H-%M-%S}

seed: 42

trainer:
  max_epochs: 200
  precision: 32
  accelerator: gpu
  devices: [0]

loss:
  h_max: 5.0
  h_min: 0.02
  sampling_method: uniform
  smart_training: true
  mean_centered: false
  # Unused while mean_centered is false; kept so switching the flag on picks
  # up a score model trained with: python scripts/train_score.py --config-name cifar10
  score_path: ${hydra:runtime.cwd}/outputs/score/cifar10
  score_epoch: null

optimizer:
  name: adam
  lr: 2.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

model:
  name: unet
  params:
    in_channels: 3
    image_size: [32, 32]
    model_channels: 128
    num_res_blocks: 2
    rank: 100
    output_dim: 3072
    attention_resolutions: [2]
    channel_mult: [1, 2, 2, 2]
    num_heads: 4
    num_head_channels: 64
    dropout: 0.1
    channel_factor: 3
    out_bias: true

data:
  name: cifar10
  batch_size: 128
  num_workers: 4
  data_dir: ${hydra:runtime.cwd}/data
  noise_level: 0.0

checkpoint:
  dirpath: checkpoints
  filename: "{epoch:04d}"
  every_n_epochs: 20
  save_last: true

logger:
  project: metric-matching
  entity: null

eval:
  name: subset_eval
  eval_subset_size: 100
  batch_size: 128
  eval_every_n_epochs: 20
