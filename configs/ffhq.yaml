# FFHQ 256x256 metric matching (mean-centred loss).
# Hyperparameters follow the paper's Appendix E.4 FFHQ configuration
# (AdamW lr 5e-5, up to 80 epochs). The recorded run that produced the
# released FFHQ model used lr 1e-5 and max_epochs 200 instead; data_root is
# set to the actual dataset location (the recorded run config carried a
# broken path).
defaults:
  - _self_

hydra:
  run:
    dir: outputs/metric/${data.name}/${now:%Y-%m-%d_%H-%M-%S}

seed: 42

trainer:
  max_epochs: 80
  precision: bf16-mixed
  accelerator: gpu
  devices: [0]

data:
  name: ffhq
  data_root: ${hydra:runtime.cwd}/data/ffhq/ffhq-dataset
  batch_size: 32
  num_workers: 8
  image_size: 256
  val_size: 10000
  pin_memory: true
  drop_last: true

model:
  name: unet
  params:
    in_channels: 3
    image_size: [256, 256]
    model_channels: 128
    num_res_blocks: 2
    rank: 256
    channel_factor: 3
    attention_resolutions: [8, 16]
    channel_mult: [1, 2, 2, 4]
    output_dim: 196608  # 3 * 256 * 256
    out_bias: true

loss:
  h_max: 5.0
  h_min: 1.0
  sampling_method: uniform
  smart_training: true
  mean_centered: true
  # Pretrained score model for the mean-centred loss. Train it first:
  #   python scripts/train_score.py --config-name ffhq
  score_path: ${hydra:runtime.cwd}/outputs/score/ffhq
  score_epoch: null

optimizer:
  name: adamw
  lr: 5.0e-5
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

eval:
  name: ffhq_viz
  eval_every_n_epochs: 1
  h_values: [1.0, 5.0, 10.0]
  perturb_scale: 12.0
  image_indices: [0, 1, 2, 3]
  eigenvector_indices: [0, 1, 2, 3]

checkpoint:
  dirpath: checkpoints
  filename: "{epoch:04d}"
  every_n_epochs: 10
  save_last: true

logger:
  project: metric-matching
  entity: null
