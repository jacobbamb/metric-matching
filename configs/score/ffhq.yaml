# FFHQ 256x256 score/denoiser model.
# Hyperparameters match the training run that produced the released FFHQ
# score model (see its .hydra/config.yaml); data_root fixed to the actual
# dataset location (the recorded run config carried a broken path).
defaults:
  - _self_

hydra:
  run:
    dir: outputs/score/${data.name}/${now:%Y-%m-%d_%H-%M-%S}

seed: 42

trainer:
  max_epochs: 200
  precision: bf16-mixed
  accelerator: gpu
  devices: [0]

loss:
  h_max: 20.0
  h_min: 0.002
  sampling_method: uniform

optimizer:
  name: adam
  lr: 2.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

model:
  name: unet
  params:
    in_channels: 3
    image_size: [256, 256]
    model_channels: 128
    num_res_blocks: 2
    channel_factor: 3
    attention_resolutions: [8, 16]
    channel_mult: [1, 2, 2, 4]
    output_dim: 196608  # 3 * 256 * 256
    rank: 1
    out_bias: false

data:
  name: ffhq
  data_root: ${hydra:runtime.cwd}/data/ffhq/ffhq-dataset
  batch_size: 32
  num_workers: 8
  image_size: 256
  val_size: 10000
  pin_memory: true
  drop_last: true

eval:
  name: ffhq_score_viz
  eval_every_n_epochs: 1
  h_values: [0.01, 0.1, 1.0, 10.0]
  noise_seed: 0
  image_indices: [0, 1, 2, 3]

checkpoint:
  dirpath: checkpoints
  filename: "{epoch:04d}"
  every_n_epochs: 10
  save_last: true

logger:
  project: metric-matching-score
  entity: null
