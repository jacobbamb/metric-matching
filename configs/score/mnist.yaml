# MNIST score/denoiser model (used by the mean-centred metric loss).
# Hyperparameters match the training run that produced the released MNIST
# score model (see its .hydra/config.yaml).
defaults:
  - _self_

hydra:
  run:
    dir: outputs/score/${data.name}/${now:%Y-%m-%d_%H-%M-%S}

seed: 42

trainer:
  max_epochs: 5000
  precision: 32
  accelerator: gpu
  devices: [0]

loss:
  h_max: 25.0
  h_min: 0.0001
  sampling_method: uniform

optimizer:
  name: adam
  lr: 2.0e-4
  betas: [0.9, 0.999]
  eps: 1.0e-8
  weight_decay: 0.0
  gradient_clip_val: 1.0
  gradient_clip_algorithm: norm

model:
  name: unet
  params:
    in_channels: 1
    out_channels: 1
    image_size: [28, 28]
    model_channels: 64
    num_res_blocks: 2
    attention_resolutions: [4]
    channel_mult: [1, 2, 2]
    output_dim: 784
    rank: 1
    out_bias: false

data:
  name: mnist
  batch_size: 128
  num_workers: 4
  data_dir: ${hydra:runtime.cwd}/data
  noise_level: 0.0

checkpoint:
  dirpath: checkpoints
  filename: "{epoch:04d}"
  every_n_epochs: 100
  save_last: true

logger:
  project: metric-matching-score
  entity: null
